<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruckPulse - Tır ve Sürüş Dünyası</title>
    <style>
        :root {
            --bg-color-1: #08080c;
            --bg-color-2: #1a080c;
            --card-bg: #121218;
            --accent: #ff4757;
            --text-color: #f1f1f1;
            --text-muted: #aaa;
            --border-color: #222;
        }

        body { cursor: none; }
        .custom-cursor {
            position: fixed; width: 20px; height: 20px; border: 2px solid var(--accent);
            border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%);
            transition: transform 0.1s ease, background 0.2s, border-color 0.2s; z-index: 9999;
            box-shadow: 0 0 10px var(--accent);
        }
        .custom-cursor.hovered { transform: translate(-50%, -50%) scale(1.8); background: rgba(255, 71, 87, 0.3); }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background-color: var(--bg-color-1);
            background-image: linear-gradient(135deg, var(--bg-color-1) 0%, var(--bg-color-2) 100%);
            color: var(--text-color); line-height: 1.6; min-height: 100vh; overflow-x: hidden;
            transition: background 0.3s;
        }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }

        header {
            background: rgba(17, 17, 17, 0.85); backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--accent); padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; transition: border-color 0.3s;
        }

        .logo { font-size: 22px; font-weight: 800; color: var(--text-color); letter-spacing: 1px; }
        .logo span { color: var(--accent); }

        .nav-right { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        nav a { color: var(--text-muted); text-decoration: none; font-weight: 600; transition: 0.3s; }
        nav a:hover { color: var(--accent); }

        .lang-btn, .theme-btn {
            background: #222; border: 1px solid var(--border-color); color: white;
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        
        .color-picker-wrapper { display: flex; align-items: center; gap: 8px; background: #16161c; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border-color); }
        .color-picker-wrapper input[type="color"] { background: none; border: none; width: 24px; height: 24px; cursor: pointer; border-radius: 4px; }
        
        /* Müzikçalar Stili */
        .music-player {
            display: flex; align-items: center; gap: 10px; background: #16161c; 
            padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 12px;
        }
        .music-player input[type="file"] { display: none; }
        .music-btn { background: #222; border: 1px solid var(--border-color); color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        .music-btn:hover { border-color: var(--accent); }
        .music-player input[type="range"] { width: 70px; accent-color: var(--accent); cursor: pointer; }

        .container { max-width: 1300px; margin: 0 auto; padding: 30px 20px; position: relative; z-index: 2; }

        .hero {
            text-align: center; padding: 40px 20px;
            background: rgba(26, 8, 8, 0.6); backdrop-filter: blur(5px);
            border-radius: 12px; margin-bottom: 30px; border: 1px solid #2a1111;
        }
        .hero h1 { font-size: 32px; margin-bottom: 10px; }
        .hero p { color: var(--text-muted); font-size: 16px; }

        section { margin-bottom: 50px; }
        h2 { font-size: 24px; margin-bottom: 20px; border-left: 4px solid var(--accent); padding-left: 10px; transition: border-color 0.3s; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

        .card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 10px; overflow: hidden; transition: 0.3s; display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 5px 15px rgba(255, 71, 87, 0.2); }

        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .card-content { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-content h3 { font-size: 16px; margin-bottom: 5px; }
        .card-content p { color: var(--text-muted); font-size: 13px; }

        footer { text-align: center; padding: 25px; background: #111; color: var(--text-muted); border-top: 1px solid var(--border-color); font-size: 13px; }
    </style>
</head>
<body>

    <div class="custom-cursor" id="cursor"></div>
    <canvas id="bg-canvas"></canvas>

    <!-- Arka Plan Müzikçalar (Kalıcı) -->
    <audio id="bg-audio" loop></audio>

    <header>
        <div class="logo">TRUCK<span>PULSE</span></div>
        <div class="nav-right">
            <nav>
                <a href="#videos" data-tr="Son Videolar" data-en="Latest Videos">Son Videolar</a>
            </nav>

            <!-- Arka Plan Renk Kutuları -->
            <div class="color-picker-wrapper">
                <span>🎨</span>
                <input type="color" id="bgColor1" value="#08080c" onchange="updateBackgroundColors()" title="Arka Plan Üst Renk">
                <input type="color" id="bgColor2" value="#1a080c" onchange="updateBackgroundColors()" title="Arka Plan Alt Renk">
            </div>

            <!-- Müzik Paneli -->
            <div class="music-player">
                <label for="musicFile" class="music-btn" title="Müzik Dosyası Seç">🎵 Müzik Seç</label>
                <input type="file" id="musicFile" accept="audio/*" onchange="handleMusicUpload(this)">
                <button class="music-btn" id="playPauseBtn" onclick="togglePlayPause()">▶ Oynat</button>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" oninput="changeVolume(this.value)" title="Ses Seviyesi">
            </div>

            <button class="lang-btn" onclick="toggleLanguage()">EN / TR</button>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <h1 data-tr="Tır Kanalı Resmi Video Akışı" data-en="Truck Channel Official Video Feed">Tır Kanalı Resmi Video Akışı</h1>
            <p data-tr="YouTube kanalından son 10 video otomatik olarak çekilmektedir." data-en="The last 10 videos are automatically fetched from the YouTube channel.">YouTube kanalından son 10 video otomatik olarak çekilmektedir.</p>
        </div>

        <section id="videos">
            <h2 data-tr="Son 10 Video" data-en="Last 10 Videos">Son 10 Video</h2>
            <div class="grid" id="youtube-grid">
                <p style="color:var(--text-muted); grid-column:1/-1; text-align:center;" data-tr="Videolar yükleniyor..." data-en="Loading videos...">Videolar yükleniyor...</p>
            </div>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 TruckPulse. <span data-tr="Tüm hakları saklıdır." data-en="All rights reserved.">Tüm hakları saklıdır.</span></p>
    </footer>

    <script>
        const CHANNEL_ID = "UClEw9mpj18NkIAetNMA_DiA";

        // İmleç Efekti
        const cursor = document.getElementById('cursor');
        window.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
        document.querySelectorAll('a, button, input').forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
        });

        // Canvas Arka Plan Efekti
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let mouseX = -1000, mouseY = -1000;
        window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

        const particles = [];
        for (let i = 0; i < 70; i++) {
            particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2.5 + 1, speedY: Math.random() * 0.8 + 0.2 });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#ff4757';
            ctx.globalAlpha = 0.4;
            
            particles.forEach(p => {
                p.y += p.speedY;
                if (p.y > canvas.height) p.y = 0;

                let dx = mouseX - p.x, dy = mouseY - p.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 80) { p.x -= dx * 0.03; p.y -= dy * 0.03; }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Arka Plan Renk Yönetimi ve Kalıcılığı
        function updateBackgroundColors() {
            const c1 = document.getElementById('bgColor1').value;
            const c2 = document.getElementById('bgColor2').value;

            document.documentElement.style.setProperty('--bg-color-1', c1);
            document.documentElement.style.setProperty('--bg-color-2', c2);
            document.body.style.backgroundImage = `linear-gradient(135deg, ${c1} 0%, ${c2} 100%)`;

            localStorage.setItem('tp_bg_c1', c1);
            localStorage.setItem('tp_bg_c2', c2);
        }

        // Müzikçalar Yönetimi ve Yerel Depolama (Base64)
        const audio = document.getElementById('bg-audio');

        window.addEventListener('DOMContentLoaded', () => {
            // Renkleri yükle
            const savedC1 = localStorage.getItem('tp_bg_c1');
            const savedC2 = localStorage.getItem('tp_bg_c2');
            if (savedC1 && savedC2) {
                document.getElementById('bgColor1').value = savedC1;
                document.getElementById('bgColor2').value = savedC2;
                updateBackgroundColors();
            }

            // Müziği yükle
            const savedMusic = localStorage.getItem('tp_saved_music');
            const savedVolume = localStorage.getItem('tp_music_vol');
            
            if (savedVolume) {
                audio.volume = parseFloat(savedVolume);
                document.getElementById('volumeSlider').value = savedVolume;
            }

            if (savedMusic) {
                audio.src = savedMusic;
                audio.play().then(() => {
                    document.getElementById('playPauseBtn').innerText = "⏸ Durdur";
                }).catch(() => {
                    // Tarayıcı otomatik oynatmayı engellerse kullanıcı tıklaması gerekebilir
                    document.getElementById('playPauseBtn').innerText = "▶ Oynat";
                });
            }

            fetchYouTubeVideos();
        });

        function handleMusicUpload(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Audio = e.target.result;
                    localStorage.setItem('tp_saved_music', base64Audio);
                    audio.src = base64Audio;
                    audio.play();
                    document.getElementById('playPauseBtn').innerText = "⏸ Durdur";
                };
                reader.readAsDataURL(file);
            }
        }

        function togglePlayPause() {
            if (!audio.src) {
                alert("Önce bir müzik dosyası seçmelisin knk!");
                return;
            }
            if (audio.paused) {
                audio.play();
                document.getElementById('playPauseBtn').innerText = "⏸ Durdur";
            } else {
                audio.pause();
                document.getElementById('playPauseBtn').innerText = "▶ Oynat";
            }
        }

        function changeVolume(val) {
            audio.volume = val;
            localStorage.setItem('tp_music_vol', val);
        }

        let currentLang = 'tr';
        function toggleLanguage() {
            currentLang = currentLang === 'tr' ? 'en' : 'tr';
            document.querySelectorAll('[data-tr]').forEach(el => {
                el.innerText = el.getAttribute(`data-${currentLang}`);
            });
        }

        async function fetchYouTubeVideos() {
            const grid = document.getElementById('youtube-grid');
            try {
                const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;
                const api = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
                
                const res = await fetch(api);
                const data = await res.json();

                if (data.status === 'ok' && data.items) {
                    grid.innerHTML = '';
                    const items = data.items.slice(0, 10);
                    
                    items.forEach(item => {
                        const videoId = item.guid.split(':').pop();
                        const embedUrl = `https://www.youtube.com/embed/${videoId}`;
                        
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <div class="video-wrapper"><iframe src="${embedUrl}" allowfullscreen></iframe></div>
                            <div class="card-content">
                                <div>
                                    <h3>${escapeHtml(item.title)}</h3>
                                    <p>${new Date(item.pubDate).toLocaleDateString()}</p>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = `<p style="color:var(--text-muted); grid-column:1/-1; text-align:center;">Videolar yüklenemedi.</p>`;
                }
            } catch (err) {
                console.error("Hata:", err);
                grid.innerHTML = `<p style="color:var(--text-muted); grid-column:1/-1; text-align:center;">Bağlantı hatası oluştu.</p>`;
            }
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }
    </script>
</body>
</html>
